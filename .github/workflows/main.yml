name: Generate Pacman
on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate pacman.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: anabeatriz630
         outputs: |
            pacman.svg?animation=pacman&color_snake=#f1c40f&color_dots=#161b22,#4a148c,#7b1fa2,#ab47bc,#e1bee7
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
